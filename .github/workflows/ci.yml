name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q bot tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  minecraft-plugin:
    name: Minecraft plugin (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          overwrite-settings: false

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build plugin
        run: mvn -B -ntp -f minecraft-plugin/pom.xml verify

      - name: Build Mohist sudo mod
        run: mvn -B -ntp -f minecraft-sudo/pom.xml verify

      - name: Verify sudo mod JAR entries
        shell: bash
        run: |
          python3 - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile

          jars = list(Path("minecraft-sudo/target").glob("MCQQSudo-*.jar"))
          assert len(jars) == 1, jars
          with ZipFile(jars[0]) as bundle:
              services = {
                  "META-INF/services/cpw.mods.modlauncher.api.ITransformationService",
                  "META-INF/services/net.minecraftforge.forgespi.locating.IModLocator",
              }
              assert services <= set(bundle.namelist())
              assert "META-INF/mods.toml" not in bundle.namelist()
              for service in services:
                  provider = bundle.read(service).decode("utf-8").strip().replace(".", "/")
                  assert f"{provider}.class" in bundle.namelist()
              version = jars[0].stem.removeprefix("MCQQSudo-")
              embedded = [entry for entry in bundle.namelist() if entry.startswith("META-INF/mcqqsudo/")
                          and entry.endswith(".jar")]
              assert embedded == [f"META-INF/mcqqsudo/MCQQSudo-{version}-game.jar"]
              with ZipFile(BytesIO(bundle.read(embedded[0]))) as game:
                  required = {"META-INF/mods.toml", "mcqqsudo.mixins.json", "config.yml", "sudo-allowlist.txt"}
                  required.update(f"cn/nightbugclub/mcqqauthcapture/{name}.class"
                                  for name in ("SudoMod", "ExecutorOutput", "StageOutput"))
                  assert required <= set(game.namelist())
                  assert services.isdisjoint(game.namelist())
                  manifest = game.read("META-INF/MANIFEST.MF").decode("utf-8")
                  assert f"Implementation-Version: {version}" in manifest.splitlines()
                  assert "MixinConfigs: mcqqsudo.mixins.json" in manifest.splitlines()
          PY

      - name: Verify plugin JAR entries
        shell: bash
        run: |
          shopt -s nullglob
          jars=(minecraft-plugin/target/MCQQAuth-*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo 'Expected exactly one MCQQAuth plugin JAR' >&2
            exit 1
          fi
          entries="$(jar tf "${jars[0]}")"
          for entry in plugin.yml config.yml cn/nightbugclub/mcqqauth/MCQQAuthPlugin.class; do
            if ! grep -Fxq -- "$entry" <<< "$entries"; then
              printf 'Missing JAR entry: %s\n' "$entry" >&2
              exit 1
            fi
          done
