# MC-QQ-Tools 默认文案。复制为同目录的 messages.yml 后修改，重启 Bot 生效。
# 只填写要覆盖的字段也可以。文案最多 1000 字符。用 {{ 和 }} 显示字面花括号。
# 通用变量可用于所有文字文案，包括状态图的标题和标签。
# {group_id} 是配置的目标 QQ 群号，{bot_qq} 是当前机器人的 QQ 号。
# 业务变量的适用字段见下方。可用变量缺少实际值时显示 —。

events:
  join:
    enabled: false
    # {member} 会生成对新成员的 QQ @，{member_qq} 是新成员的 QQ 号纯文本。
    # {member_name} 优先用群名片，其次用 QQ 昵称。
    # {member_display} 显示「昵称（QQ号）」，取不到昵称时仅显示 QQ 号。
    message: |-
      {member} 欢迎加入！请用 /绑定 游戏ID 或 /bind 游戏ID 绑定 Minecraft 游戏 ID。
      发送 /帮助 或 /help 查看指令。
  leave:
    # 关闭后仍会撤销离群成员的有效授权绑定。
    enabled: false
    # 四种通知均支持离群成员的 {member_qq}、{member_name} 和 {member_display}。
    # 离群通知直接查询 QQ 昵称。取不到时 {member_name} 为空。
    # revoked 和 retained 还支持 {mc_name}，即撤销或保留的原绑定游戏 ID。
    # 例如 retained: "成员 {member_qq} 已退出群聊，Minecraft 绑定 {mc_name} 仍保留。"
    revoked: "成员已退出群聊。Minecraft 授权已自动撤销。"
    retained: "成员已退出群聊。Minecraft 绑定仍保留。"
    no_binding: "成员已退出群聊。"
    failed: "成员已退出群聊。Minecraft 授权撤销暂未确认。"
  kick:
    # 关闭后仍会撤销被移出成员的有效授权绑定。
    enabled: false
    # 四种通知均支持被移出成员的 {member_qq}、{member_name} 和 {member_display}。
    # 被移出通知直接查询 QQ 昵称。取不到时 {member_name} 为空。
    # revoked 和 retained 还支持 {mc_name}，即撤销或保留的原绑定游戏 ID。
    revoked: "成员已被移出群聊。Minecraft 授权已自动撤销。"
    retained: "成员已被移出群聊。Minecraft 绑定仍保留。"
    no_binding: "成员已被移出群聊。"
    failed: "成员已被移出群聊。Minecraft 授权撤销暂未确认。"

commands:
  # 中英文别名共用同一套文案。
  bind:
    usage: "用法：/绑定 Minecraft玩家名"
    # success 和 already_bound 中的 {mc_name} 是新保存或已存在的绑定游戏 ID。
    success: |-
      绑定成功！
      Minecraft ID：{mc_name}
      你的绑定记录已保存。
    invalid_name: |-
      游戏 ID 格式不正确。
      请填写由英文字母、数字或下划线组成的游戏 ID，最多 16 位。
    already_bound: |-
      你已经绑定了游戏 ID：{mc_name}
      如需更换，请先使用 /解绑
    name_taken: "该游戏 ID 已经被绑定，无法重复绑定。"
    # banned_name 的 {mc_name} 是玩家本次申请绑定的游戏 ID，保留输入大小写。
    banned_name: "游戏 ID {mc_name} 已被 Minecraft 服务器封禁，暂时无法绑定。"
    error: "绑定服务发生错误，请稍后重试"
  unbind:
    # success、frozen 和 pending 中的 {mc_name} 是本次操作涉及的原绑定游戏 ID。
    success: |-
      解绑成功！
      原 Minecraft ID：{mc_name}
      绑定记录已删除。
    not_bound: "你当前没有有效的绑定记录。"
    frozen: "你绑定的 Minecraft ID {mc_name} 处于封禁冻结状态，暂时无法解绑。"
    pending: "你绑定的 Minecraft ID {mc_name} 已解封，正在核实群成员身份，暂时无法解绑。"
    error: "解绑失败，请稍后重试"
  binding:
    # success、frozen 和 pending 中的 {mc_name} 是查询到的绑定游戏 ID。
    success: "当前绑定的 Minecraft ID：{mc_name}"
    frozen: "当前绑定的 Minecraft ID：{mc_name}\n状态：封禁冻结。"
    pending: "当前绑定的 Minecraft ID：{mc_name}\n状态：已解封，正在核实群成员身份。"
    not_bound: |-
      你还没有绑定 Minecraft 游戏 ID。
      请使用 /绑定 玩家名
    error: "查询失败，请稍后重试"
  ping:
    # 收到 HTTP 响应时使用 success，包括非 2xx。{status_code} 是响应的 HTTP 状态码。
    # 四种回复均支持 {latency_ms}，即本次检测耗时，单位为毫秒。
    success: |-
      [MC-QQ-Tools] Ping
      FastAPI Health: HTTP {status_code}
      Latency: {latency_ms} ms
    timeout: |-
      [MC-QQ-Tools] Ping
      FastAPI Health: Timeout
      Latency: {latency_ms} ms
    connection_error: |-
      [MC-QQ-Tools] Ping
      FastAPI Health: Connection failed
      Latency: {latency_ms} ms
    error: |-
      [MC-QQ-Tools] Ping
      FastAPI Health: Invalid HTTP response
      Latency: {latency_ms} ms
  reconcile:
    # success 中的 {count} 是本次对账撤销的离群绑定条数。
    success: "授权对账完成，已撤销 {count} 条离群绑定。"
    failed: "授权对账未完成，请检查群成员名单和服务日志。"
    busy: "授权对账正在执行，请稍后重试。"
  db:
    usage: |-
      /db add <QQ号> <游戏名> · 添加绑定
      /db rm <QQ号或游戏名> · 删除有效绑定
      /db get <QQ号或游戏名> · 查询绑定
      纯数字有歧义时，用 qq: 或 mc: 指定类型。
    add_usage: "用法：/db add <QQ号> <游戏名>"
    rm_usage: "用法：/db rm <QQ号或游戏名>，可加 qq: 或 mc: 前缀。"
    get_usage: "用法：/db get <QQ号或游戏名>，可加 qq: 或 mc: 前缀。"
    invalid_qq: "QQ 号格式不正确，请输入 QQ 号的数字。"
    invalid_name: "游戏名须由 1–16 位英文字母、数字或下划线组成。"
    # members_unverified 至 rm_pending 的文案均支持 {member_qq}、{member_name} 和 {member_display}。
    # {member_name} 是群名片、QQ 昵称或空字符串。
    # {member_display} 显示「昵称（QQ号）」，取不到昵称时仅显示 QQ 号。
    members_unverified: "暂时无法核实目标群成员，请稍后重试。"
    # {member_qq} 是目标成员的 QQ 号，{mc_name} 是相关绑定的游戏 ID。
    not_member: "QQ {member_qq} 当前不在目标群，无法添加绑定。"
    success: "已添加绑定：{member_qq} ↔ {mc_name}〔有效〕"
    already_same: "已绑定：{member_qq} ↔ {mc_name}〔有效〕"
    already_bound: "QQ {member_qq} 已有绑定：{mc_name}〔有效〕。"
    already_frozen: "{member_qq} ↔ {mc_name}〔封禁冻结〕，请先在游戏服解封。"
    already_pending: "{member_qq} ↔ {mc_name}〔待核实群成员〕，可用 /授权对账 触发检查。"
    # name_taken 和 banned_name 的 {mc_name} 是申请绑定的游戏 ID。
    name_taken: "游戏名 {mc_name} 已被其他绑定占用。"
    banned_name: "游戏名 {mc_name} 已被游戏服封禁，暂时无法绑定。"
    active: "{member_display} ↔ {mc_name}〔有效〕"
    frozen: "{member_display} ↔ {mc_name}〔封禁冻结〕"
    pending: "{member_display} ↔ {mc_name}〔待核实群成员〕"
    removed: "已删除有效绑定：{member_qq} ↔ {mc_name}"
    rm_frozen: "{member_qq} ↔ {mc_name} 因游戏服封禁被冻结。请先在游戏服解封，待绑定恢复后重试。"
    rm_pending: "{member_qq} ↔ {mc_name} 正在等待群成员核实，可用 /授权对账 触发检查。"
    ambiguous: "按 QQ 号和游戏名查到了两条不同绑定，请用 qq: 或 mc: 指定类型。"
    not_bound: "未找到绑定。"
    error: "绑定数据库操作失败，请稍后重试。"
  help:
    # 授权启用时的帮助正文。每种文案都支持 {group_id} 和 {bot_qq}。
    message: |-
      [MC-QQ-Tools] 指令帮助
      /绑定 游戏ID 或 /bind 游戏ID · 绑定 Minecraft 游戏 ID
      /我的绑定 或 /binding · 查询自己的绑定
      /解绑 或 /unbind · 撤销自己的绑定
      /认证测试 或 /ping · 检查 API
      /帮助 或 /help · 显示本帮助
      超级用户专用
      /信息 或 /info · 查看状态图片
      /授权对账 或 /reconcile · 核对群成员与授权
      /db · 手动添加、删除或查询绑定
    # 授权关闭时使用共用帮助。启用 /sudo 时追加 sudo 文案。
    shared: |-
      指令帮助
      /认证测试 或 /ping · 检查 API
      /帮助 或 /help · 显示本帮助
      /信息 或 /info · 查看状态图片（超级用户专用）
    sudo: "/sudo <Minecraft 指令> · 执行并回显（指定 QQ 号专用）"
  info:
    busy: "状态图正在生成，请稍后重试。"
    error: "状态图暂不可用，请稍后重试。"

info:
  # 图片上按单行显示，超过可用宽度时截断。
  title: "MC-QQ-Tools"
  # 旧版兼容项。采集时间显示在账号卡内，使用 Bot 服务器的当地时间。
  footer: "MC-QQ-Tools"
  labels:
    # bot、auth_version、last_reconcile 和 last_notice 为旧版兼容项。
    bot: "Bot"
    onebot: "OneBot"
    api: "FastAPI"
    database: "SQLite"
    system_uptime: "系统"
    bot_uptime: "NoneBot2"
    connection_uptime: "OneBot 连接"
    os: "操作系统"
    python: "Python"
    cpu_cores: "逻辑核心"
    memory: "内存"
    disk: "磁盘"
    auth_version: "Authorization version"
    bindings: "有效绑定"
    bans: "封禁记录"
    last_reconcile: "Last member reconciliation"
    last_notice: "Last authorization notice"
